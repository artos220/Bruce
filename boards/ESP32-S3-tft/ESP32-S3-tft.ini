; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html



[env:esp32-s3-tft]
board = ESP-General
build_src_filter =${env.build_src_filter} +<../boards/ESP32-S3-tft>
board_build.partitions = custom_8Mb.csv
board_build.arduino.memory_type = qio_opi
build_flags =
	${env.build_flags}
	-Iboards/ESP32-S3-tft
	-Os
	-DUSE_TFT_eSPI_TOUCH
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DESP32S3_DEVKITC_1_TFT=1
	-DCORE_DEBUG_LEVEL=5
	; -DCONFIG_ESP32_JTAG_SUPPORT_DISABLE=1

	-DIR_TX_PINS='{{"GPIO 5", 5}, {"GPIO 4", 4}}'
	-DIR_RX_PINS='{{"GPIO 4", 4}, {"GPIO 5", 5}}'
	-DRF_TX_PINS='{{"Unavailable", -1}}'
	-DRF_RX_PINS='{{"Unavailable", -1}}'

	-D TFT_HEIGHT=320
	-D TFT_WIDTH=240
	-D TOUCH_XPT2046_SPI
	-D XPT2046_TOUCH_CONFIG_INT_GPIO_NUM=-1
	-D XPT2046_SPI_BUS_MISO_IO_NUM=41
	-D XPT2046_SPI_BUS_MOSI_IO_NUM=2
	-D XPT2046_SPI_BUS_SCLK_IO_NUM=42
	-D XPT2046_SPI_CONFIG_CS_GPIO_NUM=1

	; text sizes
	-DFP=1
	-DFM=2
	-DFG=3
	; ui control buttons
	;-DSEL_BTN=1
	;-DUP_BTN=2  ; also work as ESC
	;-DDW_BTN=3  ; also work as NEXT
	;Buttons configuration
	-DHAS_BTN=0
	-DBTN_ALIAS='"Ok"'
	-DBTN_PIN=0

	;FM Radio
	;-DFM_SI4713=1 ;Uncomment to activate FM Radio using Adafruit Si4713
	; -DFM_RSTPIN=12
	;Microphone
	;-DMIC_SPM1423=1 ; uncomment to enable Applicable for SPM1423 device
	;-DPIN_CLK=-1
	;-DI2S_SCLK_PIN=-1
	;-DI2S_DATA_PIN=-1
	;-DPIN_DATA=-1

	; connections are the same as W5500
	; -DUSE_W5500_VIA_SPI
	; -DW5500_SS_PIN=SPI_SS_PIN
	; -DW5500_MOSI_PIN=SPI_MOSI_PIN
	; -DW5500_SCK_PIN=SPI_SCK_PIN
	; -DW5500_MISO_PIN=SPI_MISO_PIN
	;-DW5500_INT_PIN=6
	-DDEVICE_NAME='"ESP32-S3 DevkitC"'

lib_deps =
	${env.lib_deps}
    lewisxhe/XPowersLib @0.3.0
